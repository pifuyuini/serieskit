[project]
name = "serieskit"
version = "0.21.1"
description = "Statistics, CSV analysis, and plotting for numerical series"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.urls]
Homepage = "https://github.com/pifuyuini/serieskit"
Repository = "https://github.com/pifuyuini/serieskit"
Documentation = "https://github.com/pifuyuini/serieskit/blob/main/docs/api.md"
Issues = "https://github.com/pifuyuini/serieskit/issues"

[project.scripts]
serieskit = "serieskit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serieskit"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/serieskit"]
addopts = "-q --doctest-modules"

[tool.mypy]
mypy_path = "src"
strict = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scipy-stubs>=1.18.1.0",
]
