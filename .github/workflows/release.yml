name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  python:
    needs: validate
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check tag and build
        run: |
          uv run --locked python -c 'import os, serieskit; assert os.environ["GITHUB_REF_NAME"] == "v" + serieskit.__version__'
          uv build --out-dir dist
      - name: Smoke-test the installed wheel
        run: |
          uv venv wheel-smoke
          uv pip install --python wheel-smoke/bin/python dist/*.whl
          wheel-smoke/bin/serieskit --version
          wheel-smoke/bin/python -m serieskit summary examples/sample.csv --json
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  rust:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin serieskit-rs
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target/release/serieskit-rs --version
          mkdir bundle
          cp target/release/serieskit-rs LICENSE README.md bundle/
          tar -czf serieskit-rs-${{ matrix.platform }}.tar.gz -C bundle .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          target/release/serieskit-rs.exe --version
          New-Item -ItemType Directory bundle
          Copy-Item target/release/serieskit-rs.exe, LICENSE, README.md bundle/
          Compress-Archive -Path bundle/* -DestinationPath serieskit-rs-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.platform }}
          path: serieskit-rs-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [python, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
